<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="#0D1322" />
  <rect width="512" height="512" rx="128" stroke="rgba(255,255,255,0.08)" stroke-width="8" />

  <!-- Inner ambient glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" filter="blur(30px)" />

  <!-- Main Brand Icon Symbol (Two interlocking team speech nodes & collaboration circle) -->
  <rect x="120" y="140" width="180" height="140" rx="36" fill="url(#bgGrad)" />
  <rect x="212" y="232" width="180" height="140" rx="36" fill="#6366F1" fill-opacity="0.9" stroke="#FFFFFF" stroke-width="8" />

  <!-- Connection dot accents -->
  <circle cx="210" cy="210" r="16" fill="#FFFFFF" />
  <circle cx="302" cy="302" r="16" fill="#FFFFFF" />
</svg>
