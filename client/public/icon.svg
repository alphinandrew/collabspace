<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="#0F1110" />
  <rect width="512" height="512" rx="128" stroke="#343B35" stroke-width="8" />

  <!-- Inner ambient glow -->
  <circle cx="256" cy="256" r="180" fill="url(#glowGrad)" filter="blur(30px)" />

  <!-- Main Brand Icon Symbol (Two interlocking team speech nodes & collaboration circle) -->
  <rect x="120" y="140" width="180" height="140" rx="36" fill="url(#bgGrad)" />
  <rect x="212" y="232" width="180" height="140" rx="36" fill="#181C19" fill-opacity="0.9" stroke="#22C55E" stroke-width="8" />

  <!-- Connection dot accents -->
  <circle cx="210" cy="210" r="16" fill="#F4F4EF" />
  <circle cx="302" cy="302" r="16" fill="#F59E0B" />
</svg>
